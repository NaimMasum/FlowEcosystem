plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flow.note'
    compileSdk 34

    defaultConfig {
        applicationId "com.flow.note"
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }
}

task copyWebAssets(type: Copy) {
    from '../../flow_note/public'
    into 'src/main/assets/web'
    exclude 'app.apk'
}

preBuild.dependsOn copyWebAssets

task copyPdfAssets(type: Copy) {
    from '../../flow_pdf/public'
    into 'src/main/assets/pdf'
}

preBuild.dependsOn copyPdfAssets

tasks.matching { it.name == 'assembleDebug' }.all { task ->
    task.doLast {
        copy {
            from 'build/outputs/apk/debug'
            into '../../flow_note/public'
            include 'app-debug.apk'
            rename 'app-debug.apk', 'app.apk'
        }
        try {
            copy {
                from 'build/outputs/apk/debug'
                into 'C:/Users/naim/Desktop'
                include 'app-debug.apk'
                rename 'app-debug.apk', 'FlowNote_Latest.apk'
            }
        } catch (Exception ignored) {}
        println "[*] Successfully exported updated APK to flow_note/public/app.apk"
    }
}
